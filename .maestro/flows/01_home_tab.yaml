appId: com.rafaelperazzo.appdc
name: "01 - Home Tab"
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 16000
# Elementos estruturais fixos da tela Início
- assertVisible:
    text: "SAGE"
- assertVisible:
    text: "Sistema de Alocação e Gestão de Espaços"
- assertVisible:
    text: "Departamento de Computação · UFRPE"
# Botão de login (modo público — sem autenticação)
- assertVisible:
    text: "Entrar como administrador"
# Cards de módulos
- assertVisible:
    text: "SAGE Map"
- assertVisible:
    text: "SAGE Agenda"
- assertVisible:
    text: "SAGE Report"
- assertVisible:
    text: "SAGE Auditório"
- assertVisible:
    text: "SAGE Manutenção"
- takeScreenshot: screenshots/01_home_tab
# Link para o Sobre — fica no rodapé da tela rolável e, em telas menores (ex.: Pixel 6
# API 31 do CI, com barra de navegação de 3 botões), fica abaixo da dobra: rola até ele.
- scrollUntilVisible:
    element:
      text: "Sobre o SAGE"
    direction: DOWN
    timeout: 10000
- stopApp
