appId: com.rafaelperazzo.appdc
name: "09 - Sobre Screen"
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 16000

# Garante que está na Home e rola até o link do Sobre — ele fica no rodapé da tela
# rolável e, em telas menores (ex.: Pixel 6 API 31 do CI), fica abaixo da dobra.
- scrollUntilVisible:
    element:
      text: "Sobre o SAGE"
    direction: DOWN
    timeout: 10000

# Navega para a tela Sobre
- tapOn:
    text: "Sobre o SAGE"
- waitForAnimationToEnd:
    timeout: 10000

# Verifica conteúdo da tela Sobre (card de documentação do primeiro módulo)
- assertVisible:
    text: "SAGE Map"

- takeScreenshot: screenshots/09_sobre_screen

# Volta para a Home
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 10000

# Confirma retorno à Home — a Home mantém a rolagem de antes, então volta ao topo
- scrollUntilVisible:
    element:
      text: "SAGE"
    direction: UP
    timeout: 10000
- assertVisible:
    text: "Sistema de Alocação e Gestão de Espaços"

- takeScreenshot: screenshots/09_sobre_back_to_home
- stopApp
